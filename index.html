<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Pegada de Plástico ♻️</title>
    <style>
        :root {
            --primary: #11998e;
            --primary-dark: #0c736b;
            --secondary: #38ef7d;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --gray: #e9ecef;
            --text-gray: #6c757d;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            padding: 35px;
            position: relative;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .start-screen {
            text-align: center;
        }

        .start-screen h1 {
            color: var(--dark);
            font-size: 28px;
            margin-bottom: 12px;
        }

        .start-screen p {
            color: var(--text-gray);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--gray);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(17, 153, 142, 0.3);
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #6c757d;
            box-shadow: none;
            margin-top: 10px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
        }

        .user-tag {
            font-size: 14px;
            background: var(--light);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--dark);
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: var(--gray);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 19px;
            color: var(--dark);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid var(--gray);
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            color: var(--dark);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #e8f8f5;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #d1f2eb;
            font-weight: bold;
        }

        .feedback-card {
            display: none;
            background: #e8f8f5;
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .feedback-pts {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .feedback-msg {
            font-size: 14px;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .result-screen {
            text-align: center;
        }

        .score-badge {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 36px;
            font-weight: bold;
        }

        .score-badge span {
            font-size: 12px;
            font-weight: normal;
        }

        .badge-title {
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 12px;
        }

        .desc-text {
            color: var(--text-gray);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            background: var(--light);
            padding: 15px;
            border-radius: 12px;
        }

        .ranking-screen h2 {
            color: var(--dark);
            font-size: 24px
